<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Study Platform</title>
  <link rel="stylesheet" href="dsg.css">
</head>
<body>
  <header>
    <h1>Virtual Study Platform</h1>
    <nav>
      <a href="#" id="login">Login</a>
      <a href="#" id="signup">Sign Up</a>
    </nav>
  </header>

  <main>
    <section id="study-groups">
      <h2>Study Groups</h2>
      <ul id="group-list"></ul>
      <button id="create-group">Create Group</button>
    </section>

    <section id="chat">
      <h2>Group Chat</h2>
      <div id="chat-window"></div>
      <input type="text" id="chat-input" placeholder="Type a message...">
      <button id="send-message">Send</button>
    </section>
  </main>

  <script src="itr.js"></script>
</body>
</html>
